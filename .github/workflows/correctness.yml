name: Correctness
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  gate:
    name: Gate (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: arm64-macos
          - runner: ubuntu-24.04
            host: x86_64-linux
          - runner: ubuntu-24.04-arm
            host: arm64-linux
    defaults:
      run:
        shell: bash
        working-directory: luce-base
    env:
      CC: clang
      CXX: clang++
      LUCE_CI_HOST: ${{ matrix.host }}
      LUCE_TEST_GPU: optional
      LUCE_TEST_WINDOW: optional
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-base
          fetch-depth: 0
      - name: Read the library pin
        id: pins
        run: echo "std=$(cat bootstrap/STD)" >> "$GITHUB_OUTPUT"
      # the compiler's own package depends on luce-std beside it
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          ref: ${{ steps.pins.outputs.std }}
          path: luce-std
      - name: Build pinned seed and install SDL3
        run: bash tools/ci_dependencies.sh
      - name: Install Linux font backend and valgrind
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core valgrind
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Record toolchain and dependency provenance
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py | tee build/provenance.json
      - name: Run the gate
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee build/gate.log
      - name: Diagnose a failed Linux bootstrap
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          bash tools/ci_backtrace.sh
      - name: Record final dependency provenance
        if: always()
        run: |
          mkdir -p build
          python3 tools/ci_provenance.py > build/provenance-final.json
      - name: Retain diagnostics and replay records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-base-${{ matrix.host }}-${{ github.sha }}
          path: |
            luce-base/build/*.log
            luce-base/build/conformance.out
            luce-base/build/conformance.err
            luce-base/build/luce-base/build/*.log
            luce-base/build/provenance*.json
            luce-base/build/dwarf/
            luce-base/build/failures/
            luce-base/build/fuzz/
            luce-base/build/hardware-skip.txt
          retention-days: 14
  stress:
    # every fuzzing generator on x86-64, for a bounded time, and the compile budget: real
    # packages built for every target within a time and a memory, so a compiler that hangs
    # or grows without bound on them fails here rather than as a dead runner elsewhere
    name: Fuzz and compile budget (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: luce-base
    env:
      CC: clang
      CXX: clang++
      LUCE_CI_HOST: x86_64-linux
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-base
      - name: Read the library pin
        id: pins
        run: echo "std=$(cat bootstrap/STD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          ref: ${{ steps.pins.outputs.std }}
          path: luce-std
      - name: Fetch the packages the budget builds
        working-directory: .
        run: |
          for repo in luce-js luce-regex luce-compress luce-browser-foundation luce-browser-css luce-browser-html luce-browser-render luce-browser-engine; do
            git clone -q --depth 1 "https://github.com/dymokomi/$repo" "$repo"
          done
      - name: Build pinned seed
        run: bash tools/ci_dependencies.sh
      - name: Select Clang for generated C
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build
        run: ./build.sh
      - name: Compile budget
        run: python3 tools/compile_budget.py --seconds 240 --megabytes 4096 ../luce-js/tests/ljs.lucb ../luce-browser-engine/src/luce_browser_engine/web/module.lucb
      - name: Differential fuzz, every generator, 20 minutes
        run: python3 tools/fuzz.py --seed ${{ github.run_number }} --minutes 20 --mutations 400 --programs 60 --trap-programs 40 --packages 12 --mem-programs 24 --atomic-programs 12 --litmus-programs 8 --width-programs 60
      - name: Retain the findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-base-stress-${{ github.sha }}
          path: |
            luce-base/build/fuzz/
          retention-days: 14
