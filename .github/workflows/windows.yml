name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
        working-directory: luce-base
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-base
      # the compiler's own package depends on luce-std beside it, at main (docs/CI.md)
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          path: luce-std
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Bootstrap and verify native self-hosting
        run: python tools/build_windows.py
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-seed
          path: luce-base/build/seed
      - name: Verify fresh seed bootstrap
        run: |
          cmake -S build/seed -B build/seed/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/seed/build-windows -j 4
          python tools/build_windows.py --seed build/seed/build-windows/lucb.exe
      # every module's tests through both backends, as test.sh runs them on Unix
      - name: Compiler unit tests
        run: |
          set -eo pipefail
          # the compiler's tests are its package's, which a test of its entry runs (§16.5)
          ./build/luce-base.exe test src/main.lucb --backend=c | tail -1
          ./build/luce-base.exe test src/main.lucb --native | tail -1
          for f in tests/programs/*/*.lucb; do
            if grep -rq '^test "' "$f"; then
              echo "== test $f"
              ./build/luce-base.exe test "$f" --backend=c | tail -1
              ./build/luce-base.exe test "$f" --native | tail -1
            fi
          done
      - name: Test runner process ownership
        run: |
          python tools/test_validation_process.py
          python tools/test_platform_boundaries.py
      - name: Console termination and cleanup acknowledgement
        run: python tests/programs/termination/run.py build/luce-base.exe
      - name: Windows OS contracts
        run: |
          python tools/test_windows_arguments.py --compiler build/luce-base.exe
          python tools/test_windows_native.py
          python tools/test_windows_debug.py
          python tests/programs/external_storage/run.py build/luce-base.exe
          python tests/programs/strings_floats/run.py build/luce-base.exe
      - name: Native and C conformance
        run: python tools/test_windows.py --suite conformance --c
      - name: Samples and fuzzing
        run: |
          python tools/test_windows.py --suite samples --c
          python tools/fuzz.py --gate
      - name: Differential fuzz, every generator, 15 minutes
        run: python tools/fuzz.py --seed ${{ github.run_number }} --minutes 15 --mutations 200 --programs 30 --trap-programs 20 --packages 6 --mem-programs 12 --atomic-programs 6 --litmus-programs 4 --width-programs 30
      # the benchmark's driver and runner on Windows: every variant built and checked
      - name: Native and C kernels agree
        run: python benchmarks/native_vs_c/run.py --cc gcc --verify-only
      - name: A held output is replaced; parameters stay in registers
        run: |
          python tools/test_windows_publish.py build/luce-base.exe
          python tools/test_windows_parameters.py build/luce-base.exe
          python tools/test_module_batches.py build/luce-base.exe
          python tools/test_package_tests.py build/luce-base.exe
      # real programs, checked out with CRLF line endings as Git for Windows does, built
      # for every target: tools/budget_packages.py's programs and their dependencies, at main
      - name: Compile budget
        run: |
          python tools/budget_packages.py --crlf > "$RUNNER_TEMP/budget-entries"
          python tools/compile_budget.py --compiler build/luce-base.exe --seconds 240 --megabytes 4096 $(cat "$RUNNER_TEMP/budget-entries")
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-base-windows-${{ github.sha }}
          path: |
            luce-base/build/windows-*.json
            luce-base/build/windows-*.jsonl
            luce-base/build/windows-fixedpoint-*
          retention-days: 14
