name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
        working-directory: luce-base
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-base
      - name: Read the library pin
        id: pins
        shell: pwsh
        working-directory: luce-base
        run: '"std=$(Get-Content bootstrap/STD)" >> $env:GITHUB_OUTPUT'
      # the compiler's own package depends on luce-std beside it
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          ref: ${{ steps.pins.outputs.std }}
          path: luce-std
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Bootstrap and verify native self-hosting
        run: python tools/build_windows.py
      - name: Read seed pin
        id: seed
        run: echo "revision=$(cat bootstrap/SEED)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-seed
          ref: ${{ steps.seed.outputs.revision }}
          path: luce-base/build/seed
      - name: Verify fresh seed bootstrap
        run: |
          cmake -S build/seed -B build/seed/build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/seed/build-windows -j 4
          python tools/build_windows.py --seed build/seed/build-windows/lucb.exe
      - name: Compiler unit tests
        run: |
          ./build/luce-base.exe test src/main.lucb
          ./build/luce-base.exe test src/support/arena.lucb
          ./build/luce-base.exe test src/support/arena.lucb --backend=c
      - name: Test runner process ownership
        run: |
          python tools/test_validation_process.py
          python tools/test_platform_boundaries.py
      - name: Console termination and cleanup acknowledgement
        run: python tests/programs/termination/run.py build/luce-base.exe
      - name: Windows OS contracts
        run: |
          python tools/test_windows_arguments.py --compiler build/luce-base.exe
          python tools/test_windows_native.py
          python tools/test_windows_debug.py
          python tests/programs/external_storage/run.py build/luce-base.exe
          python tests/programs/strings_floats/run.py build/luce-base.exe
      - name: Native and C conformance
        run: python tools/test_windows.py --suite conformance --c
      - name: Samples and fuzzing
        run: |
          python tools/test_windows.py --suite samples --c
          python tools/fuzz.py --gate
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-base-windows-${{ github.sha }}
          path: |
            luce-base/build/windows-*.json
            luce-base/build/windows-*.jsonl
            luce-base/build/windows-fixedpoint-*
          retention-days: 14
